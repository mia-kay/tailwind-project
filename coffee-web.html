<!DOCTYPE html>
<html lang="en">
<head>
    <title>Coffee Time</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
<section class="relative w-full h-[85vh] bg-cover bg-center" style="background-image: url('https://media.istockphoto.com/id/468658670/photo/aroma-coffee-cup-with-roasted-grains.jpg?s=612x612&w=0&k=20&c=DyOjzz1ezq6ptPMrSWyrXMi1_gDCZw5koIRuB7gOZ3k=');">
  <div class="absolute inset-0 bg-black/40"></div>

  <div class="absolute top-0 left-0 w-full flex justify-between items-center px-8 py-6">
    <div class="text-4xl" style="font-family: 'Pacifico', cursive;">
      <span class="text-white block">Coffee</span>
      <span class="text-amber-100 block ml-2">Time</span>
    </div>
    <nav class="space-x-6 text-white font-normal">
      <a href="#" class="hover:underline">Menu</a>
      <a href="#" class="hover:underline">About Us</a>
      <a href="#" class="hover:underline">Services</a>
      <a href="#" class="hover:underline">Contact Us</a>
    </nav>
  </div>

  <div class="relative z-10 flex flex-col justify-center h-full px-8 md:px-16 lg:px-32 max-w-2xl text-left">
    <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold leading-tight">
      <span class="text-amber-100 block">Experience</span>
      <span class="whitespace-nowrap">
        <span class="text-amber-100 inline-block border-b-4 border-amber-100 pb-1">the</span>
        <span class="text-white"> Art of Coffee.</span>
      </span>
    </h1>

    <p class="mt-4 md:mt-6 text-base md:text-lg text-white/90 leading-relaxed">
      Explore our premium selection of<br>
      handcrafted coffee beans brewed,<br>
      to perfection.
    </p>

    <a href="#shop" class="mt-8 md:mt-10 inline-block bg-white text-black font-semibold px-6 py-2 rounded-lg hover:bg-gray-200 transition w-max">
      Shop Now
    </a>
  </div>

  <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 flex space-x-2">
    <span class="w-3 h-3 bg-white rounded-full"></span>
    <span class="w-3 h-3 bg-white/50 rounded-full"></span>
    <span class="w-3 h-3 bg-white/50 rounded-full"></span>
  </div>
</section>
</body>
</html>
